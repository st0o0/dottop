name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/dottop.slnx

      - name: Build
        run: dotnet build src/dottop.slnx --no-restore -c Release

      - name: Test
        run: dotnet test tests/dottop.Actors.Tests/ --no-build -c Release
