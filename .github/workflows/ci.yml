name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/dottop/dottop.csproj

      - name: Build
        run: dotnet build src/dottop/dottop.csproj --no-restore -c Release

      - name: Restore Tests
        run: dotnet restore src/dottop.Tests/dottop.Tests.csproj

      - name: Build Tests
        run: dotnet build src/dottop.Tests/dottop.Tests.csproj --no-restore -c Release

      - name: Test
        run: dotnet test src/dottop.Tests/dottop.Tests.csproj --no-build -c Release -v normal
