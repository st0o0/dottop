name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: dtop-win-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: dtop-linux-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: dtop-osx-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/dtop.App/dtop.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ needs.release-please.outputs.version }}
          -p:AssemblyVersion=${{ needs.release-please.outputs.version }}
          -p:FileVersion=${{ needs.release-please.outputs.version }}
          -p:InformationalVersion=${{ needs.release-please.outputs.version }}
          -o publish/${{ matrix.artifact }}

      - name: Archive (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C publish ${{ matrix.artifact }}

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path publish/${{ matrix.artifact }} -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
